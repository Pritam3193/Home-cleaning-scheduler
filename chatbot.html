<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Cleaning Scheduler</title>
    <link rel="stylesheet" href="chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                var filteredData = jsonData.filter(row => row.some(filledCell));
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
    </script>
    <header>
        <h1>Home Cleaning Scheduler</h1>
        <p>Effortlessly schedule professional cleaning services with our smart chatbot.</p>
    </header>
    <main>
        <section id="chat-container">
            <div id="chat-box">
                <div class="message bot-message">
                    <img src="https://cdn-icons-png.freepik.com/256/12167/12167613.png" alt="Bot Avatar" class="avatar">
                    <div class="message-content">
                        <p>Welcome to the Home Cleaning Scheduler! Type something like 'Schedule deep cleaning for tomorrow at 10 AM' or ask about pricing.</p>
                        <span class="timestamp"></span>
                    </div>
                </div>
            </div>
            <div id="input-container">
                <input type="text" id="user-input" placeholder="Type your cleaning task or question..." />
                <button id="send-btn">Send</button>
            </div>
        </section>
    </main>
